<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLOCK SNAPPY</title>
<style>
@property --b1{syntax:"<color>";inherits:true;initial-value:#8fa9ee}
@property --b2{syntax:"<color>";inherits:true;initial-value:#6a82d8}
:root{transition:--b1 1.3s,--b2 1.3s}
:root{--bgi:linear-gradient(#0000,#0000);--b1:#8fa9ee;--b2:#6a82d8;--bd:#2b3470;--ce:#363f82;--cs:40px;--ts:23px;--gold:#ffd21f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Baloo 2","Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:#fff;background:var(--bgi,linear-gradient(#0000,#0000)),radial-gradient(120% 90% at 50% 0%,var(--b1),var(--b2));touch-action:none;text-shadow:0 2px 0 rgba(0,0,0,.22)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex}
/* menu */
#menu{justify-content:center;gap:14px}
.logo{text-align:center;line-height:.9;font-size:clamp(46px,13vw,86px);font-style:italic;letter-spacing:1px;text-shadow:0 4px 0 #1b2a7a,0 0 0 #000,0 10px 24px rgba(0,0,0,.35);-webkit-text-stroke:3px #2a3b9c;paint-order:stroke fill}
.logo b{display:block;color:var(--gold);font-size:.8em}
.best{display:flex;gap:10px;align-items:center;font-size:26px;color:var(--gold);margin-bottom:10px}
.crown{font-size:30px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.btn{min-width:min(78vw,300px);padding:12px 22px;border-radius:18px;font-size:22px;background:linear-gradient(#5b8bff,#2f5be0);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 #1b3aa6,0 10px 18px rgba(0,0,0,.3);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 2px 0 #1b3aa6}
.btn.play{font-size:32px;padding:16px 22px;background:linear-gradient(#5fe36b,#22b43a);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 #14762a,0 10px 18px rgba(0,0,0,.3)}
.btn.play:active{box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 2px 0 #14762a}
.btn.red{background:linear-gradient(#ff6a5b,#d8321f);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 #8f1c10}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .btn{min-width:0;font-size:17px;padding:10px 14px}
.fl{position:absolute;inset:0;overflow:hidden;pointer-events:none;contain:layout paint style}
.fb{position:absolute;bottom:-60px;opacity:.35;will-change:transform;animation:rise linear infinite;border-radius:6px}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.mc{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.lg{display:flex;flex-direction:column;gap:6px;align-items:center}
.lr{display:flex;gap:6px;justify-content:center}
.lr i{background-image:radial-gradient(circle at 50% 38%,rgba(255,255,255,.4),transparent 65%);font-style:normal;width:clamp(42px,13vw,66px);height:clamp(42px,13vw,66px);display:grid;place-items:center;font-size:clamp(28px,8.6vw,44px);border-radius:10px;background:var(--c);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 4px 0 0 rgba(255,255,255,.2),inset 0 -5px 0 rgba(0,0,0,.3),inset -4px 0 0 rgba(0,0,0,.18),0 8px 14px rgba(0,0,0,.3);animation:drop .6s cubic-bezier(.3,1.6,.5,1) var(--d) backwards,wave 3s ease-in-out calc(var(--d) + .8s) infinite}
.lr.m i{width:clamp(38px,11.5vw,58px);height:clamp(38px,11.5vw,58px);font-size:clamp(25px,7.6vw,38px)}
@keyframes drop{from{transform:translateY(-90px) scale(.5);opacity:0}}
@keyframes wave{50%{transform:translateY(-5px)}}
.tag{margin:0;font-size:17px;opacity:.9;text-align:center;padding:0 16px}
.bc{display:flex;align-items:center;gap:12px;padding:8px 24px;border-radius:18px;background:rgba(10,12,40,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.bc small{display:block;font-size:13px;opacity:.8;line-height:1}.bc b{font-size:34px;line-height:1.1;color:var(--gold)}
#menu .play{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,400px)}
.gb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:16px;background:rgba(255,255,255,.14);font-size:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.2);transition:transform .12s,background .12s}
.gb span{font-size:26px}.gb:hover{background:rgba(255,255,255,.26);transform:translateY(-3px)}.gb:active{transform:translateY(2px)}
.dq{width:min(92vw,400px);font-size:15px;padding:10px 14px;border-radius:14px;background:rgba(10,12,40,.4)}.dq b{float:right;color:var(--gold)}
.cell.fall{animation:fall .9s ease-in forwards;z-index:3;position:relative}
@keyframes fall{25%{filter:brightness(1.8);transform:translateY(-18px) scale(1.1)}to{transform:translate(var(--dx),75vh) rotate(var(--rt));opacity:0}}
.fs{position:fixed;z-index:45;pointer-events:none;transform:translate(-50%,-50%);font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.55);animation:fup .9s ease-out forwards}
.fs.bg{font-size:30px;color:#ffe45c}
@keyframes fup{to{transform:translate(-50%,-170%);opacity:0}}
.bw.cel::before{content:"";position:absolute;inset:-11px;border:6px dotted #ffd54a;border-radius:24px;pointer-events:none;animation:blink .6s infinite alternate;filter:drop-shadow(0 0 6px #ffd54a)}
@keyframes blink{from{opacity:.35}to{opacity:1}}
#board.rb{animation:rbw 1.4s ease-out}
@keyframes rbw{0%{box-shadow:0 0 40px 12px #f33}20%{box-shadow:0 0 40px 12px #ff3}40%{box-shadow:0 0 40px 12px #3f3}60%{box-shadow:0 0 40px 12px #3ff}80%{box-shadow:0 0 40px 12px #f3f}100%{box-shadow:0 0 0 3px rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.35)}}
#heart{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cs)*7.5);line-height:1;color:#ff4fd8;filter:blur(3px) drop-shadow(0 0 30px #ff4fd8);opacity:0;pointer-events:none;z-index:4}
#heart.on{animation:hh 1.5s ease-out}
@keyframes hh{0%{transform:scale(.3);opacity:0}30%{transform:scale(1);opacity:.85}100%{transform:scale(1.35);opacity:0}}
#pop.mega{animation:pm 1.9s ease-out;font-size:clamp(40px,11vw,70px)}
@keyframes pm{0%{transform:translate(-50%,-50%) scale(0)}14%{transform:translate(-50%,-50%) scale(1.25)}24%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.mk{display:inline-block;width:1em;height:1em;margin:0 .15em;vertical-align:middle;border-radius:.2em;-webkit-text-stroke:0;background:radial-gradient(circle at 30% 38%,#111 0 .06em,#fff .07em .14em,transparent .15em),radial-gradient(circle at 70% 38%,#111 0 .06em,#fff .07em .14em,transparent .15em),radial-gradient(ellipse at 50% 72%,#fff 0 .14em,transparent .15em),var(--c);box-shadow:inset 0 .06em 0 rgba(255,255,255,.5),inset 0 -.07em 0 rgba(0,0,0,.3),0 .06em .1em rgba(0,0,0,.4);animation:jmp .45s ease-in-out infinite alternate}
.mk+em+.mk,.mk:last-child{animation-delay:.2s}
@keyframes jmp{to{transform:translateY(-.25em) rotate(8deg)}}
.cell.pv{box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.box.st{background:linear-gradient(#e6d2ae,#cdb48a);padding:12px;border-radius:26px}
.sth{display:flex;justify-content:center;align-items:center;position:relative;margin-bottom:10px;min-height:36px}
.sth b{font-size:28px;color:#4a392f;text-shadow:0 2px 0 rgba(255,255,255,.45)}
.x{position:absolute;right:4px;background:none;font-size:26px;color:#3a2c24;text-shadow:none}
.stp{background:#54413a;border-radius:18px;padding:14px;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
.ir{display:flex;justify-content:space-around}
.ic{background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.ic span{font-size:38px;line-height:1;position:relative}
.ic.off span::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:4px;background:#e33;transform:rotate(-40deg);border-radius:2px}
.vr{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0 4px}
.vr button{width:28px;height:24px;border-radius:6px;background:#fff;color:#333;font-size:18px;line-height:1;text-shadow:none}
.vr i{width:90px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);position:relative}
.vr u{position:absolute;left:0;top:0;bottom:0;background:#8d8df2;border-radius:5px}
.stp hr{border:0;height:1px;background:rgba(255,255,255,.15);margin:8px 0 4px}
.sbn{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:11px 18px;border-radius:14px;font-size:22px;text-align:left;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s}
.sbn span{width:34px;text-align:center;font-size:26px}.sbn:hover{filter:brightness(1.1)}.sbn:active{transform:translateY(3px)}
.pu{background:linear-gradient(#e75cf5,#a523cc)}.gr2{background:linear-gradient(#4fe23c,#21a51a)}.bl{background:linear-gradient(#2ec8f6,#1096da)}.rd{background:linear-gradient(#ff6a5b,#d8321f)}
.beam{position:absolute;z-index:3;pointer-events:none;border-radius:6px;background:linear-gradient(90deg,transparent,var(--bc) 25%,#fff 50%,var(--bc) 75%,transparent);box-shadow:0 0 26px 8px var(--bc);animation:bmh .65s ease-out forwards}
.beam.v{background:linear-gradient(0deg,transparent,var(--bc) 25%,#fff 50%,var(--bc) 75%,transparent);animation-name:bmv}
@keyframes bmh{0%{opacity:0;transform:scaleX(.1)}25%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.04) scaleY(1.5)}}
@keyframes bmv{0%{opacity:0;transform:scaleY(.1)}25%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.04) scaleX(1.5)}}
.sb{position:relative}
#score{position:relative;z-index:1}
#sh{position:absolute;left:50%;top:50%;font-size:70px;line-height:1;color:#ff5fa8;transform:translate(-50%,-50%) scale(var(--hs,1));transition:transform .18s,color .4s;opacity:.85;z-index:0;pointer-events:none;text-shadow:0 0 18px currentColor}
@keyframes hue{from{filter:blur(1px) drop-shadow(0 0 12px #ff5fa8) hue-rotate(0)}to{filter:blur(1px) drop-shadow(0 0 12px #ff5fa8) hue-rotate(360deg)}}
.cell.bn::after{content:attr(data-n);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;height:52%;border-radius:50%;background:#eaf1ff;color:#3a4a8a;font-size:calc(var(--cs)*.32);display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:0 0 0 2px #7fa3ff}
.star{position:fixed;z-index:46;pointer-events:none;font-size:22px;margin:-11px 0 0 -11px;transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .7s}
.fs.sm{font-size:12px;animation-duration:.7s}
.pc.in{animation:spin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{from{transform:scale(.2) rotate(-20deg);opacity:0}}
#pop small{display:block;font-size:.36em;margin:2px auto 0;width:max-content;color:#fff;-webkit-text-stroke:3px #c2187a;padding:0 22px;background:linear-gradient(90deg,transparent,rgba(226,77,240,.7),transparent);text-shadow:none;font-style:normal}
#pop.ep{color:#9dff62;-webkit-text-stroke:6px #1d6a1f}
#pop.lg{color:#ffd24a;-webkit-text-stroke:6px #7a2a8a}
#pop.cm{font-size:clamp(46px,13vw,80px)}
[data-i]{display:inline-flex;width:1.1em;height:1.1em;vertical-align:middle;flex:none}
[data-i] svg{width:100%;height:100%;display:block}
#sh{width:72px;height:72px;font-size:0}#sh svg,#heart svg{display:block;width:100%;height:100%}
#heart svg{width:calc(var(--cs)*7.5);height:calc(var(--cs)*7.5)}
.star svg{width:22px;height:22px;display:block}
.ic span{display:block;width:40px;height:40px}
.crown{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}

#mascot{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 5vh);width:clamp(110px,34vw,165px);transform:translate(-50%,140%);z-index:55;pointer-events:none;opacity:0;visibility:hidden}

.bd{animation:bob .45s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}

@keyframes wvl{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}@keyframes wvr{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.ey{transform-origin:80px 102px;animation:blk 1.6s infinite}@keyframes blk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 30px 10px rgba(255,255,255,.75),inset 0 0 20px rgba(255,255,255,.6);pointer-events:none;z-index:6;animation:ringx .95s ease-out forwards}
@keyframes ringx{from{transform:scale(1);opacity:1}to{transform:scale(34);opacity:0}}

.pc.flip{animation:flip .8s ease-in-out}

em{font-style:normal}

.gL{transform-origin:50px 118px;animation:gw .6s ease-in-out infinite alternate}

@keyframes gtl{50%{transform:skewX(-7deg)}}

.ms p.lt{font-size:15px;line-height:1.45;margin:8px 2px 10px;text-align:left}

#game{gap:6px;padding-top:calc(env(safe-area-inset-top) + 8px)}
.hd{width:min(94vw,560px);display:flex;justify-content:space-between;align-items:center}
.hd .best{margin:0;font-size:28px}
.ib{width:44px;height:44px;border-radius:14px;font-size:22px;background:rgba(255,255,255,.14);margin-left:6px;transition:transform .12s,background .12s}
.ib:hover{background:rgba(255,255,255,.26);transform:scale(1.08)}.ib:active{transform:scale(.92)}
.sb{min-width:200px;text-align:center;padding:4px 26px;border-radius:20px;background:rgba(10,12,40,.55);border:3px solid #f00;box-shadow:0 0 14px rgba(255,255,255,.3);animation:rgbb 4s linear infinite}
@keyframes rgbb{0%,100%{border-color:#f33}17%{border-color:#ff3}33%{border-color:#3f3}50%{border-color:#3ff}67%{border-color:#36f}83%{border-color:#f3f}}
#score{font-size:clamp(40px,10vw,58px);line-height:1.1;color:transparent;text-shadow:none;background:linear-gradient(90deg,#f33,#ff3,#3f3,#3ff,#36f,#f3f,#f33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:rgbt 3s linear infinite;transition:transform .15s}
@keyframes rgbt{to{background-position:-200% 0}}
.gear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;margin:0}
#score.bump{transform:scale(1.18)}
.bw{position:relative}
#board{display:grid;grid-template-columns:repeat(8,var(--cs));gap:2px;padding:6px;background:var(--bd);border-radius:16px;box-shadow:0 0 0 4px rgba(255,236,200,.5),0 0 0 6px rgba(0,0,0,.18),0 14px 30px rgba(0,0,0,.35);touch-action:none}

@media (max-width: 600px) {
  .scr { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  #menu { gap: 9px; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #menu .mc { gap: 9px; }
  .tag { font-size: clamp(13px, 3.8vw, 17px); }
  .btn { min-width: min(82vw, 300px); }
  .hd { width: 94vw; min-height: 42px; }
  .hd .best { font-size: clamp(20px, 6vw, 28px); }
  .ib { width: 42px; height: 42px; }
  .sb { min-width: 0; width: min(62vw, 240px); padding: 3px 16px; }
  #score { font-size: clamp(34px, 10vw, 52px); }
  #board { gap: 2px; padding: 6px; max-width: 94vw; }
  #tray { width: 96vw; margin-top: 4px; }
  .slot { min-width: 0; }
  .box { width: min(94vw, 400px); max-height: 84dvh; padding: 16px; }
  .box h2 { font-size: clamp(24px, 7vw, 30px); }
  .gear { top: calc(env(safe-area-inset-top) + 8px); right: 8px; }
}
@media (max-height: 700px) {
  #game { gap: 3px; padding-top: calc(env(safe-area-inset-top) + 4px); }
  #tray { margin-top: 2px; }
  .slot { height: calc(var(--ts)*4 + 14px); }
  #menu { gap: 6px; }
  #menu .mc { gap: 6px; }
  #menuGhost svg { width: clamp(58px, 10vh, 88px); }
  .tag { margin: 0; }
}
@media (orientation: landscape) and (max-height: 520px) {
  #game { gap: 2px; padding-top: max(3px, env(safe-area-inset-top)); }
  .hd { min-height: 34px; }
  .ib { width: 34px; height: 34px; border-radius: 10px; }
  .sb { padding: 0 12px; }
  #score { font-size: 32px; }
  #tray { margin-top: 0; }
  .slot { height: calc(var(--ts)*3 + 10px); }
  #menu .mc { gap: 5px; }
  #menuGhost svg { width: 54px; }
  .logo { font-size: clamp(34px, 8vw, 54px); }
  .btn.play { font-size: 24px; padding: 8px 18px; }
  .gr { gap: 6px; }
}

function evalBoard(G){let e=0;const seen=Array.from({length:N},()=>Array(N).fill(false));let reg=0;

function bestFor(G,s){let best=null;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canP(G,s,r,c)){
  let t=0;for(const [a,b] of s)for(const [dy,dx] of NB){const y=r+a+dy,x=c+b+dx;if(y<0||y>=N||x<0||x>=N||G[y][x]>=0)t++}
  const [n,L]=simPl(G,s,r,c),sc=L*75+evalBoard(n)+t/s.length*2.5;
  if(!best||sc>best.sc)best={sc,r,c,grid:n,L}}
 return best}

 for(let k=0;k<3;k++){const L=[];
  for(const s of SHAPES){if(p.some(q=>q.s===s))continue;const b=bestFor(G,s);if(b)L.push({s,b,v:b.sc+Math.random()*7})}
  if(!L.length){p.push(rnd());continue}
  L.sort((a,b)=>b.v-a.v);const u=Math.random(),pk=L[u<AIP[0]?0:u<AIP[1]?Math.min(1,L.length-1):Math.min(2,L.length-1)];
  p.push({s:pk.s,c:Math.random()*COL.length|0});G=pk.b.grid}
 if(!p.some(x=>fits(x.s)))for(let t=0;t<80&&!p.some(x=>fits(x.s));t++)p[2]=rnd();
 return p.sort(()=>Math.random()-.5)}

 бонусные очки.","埋まった行と列が消えます。同時に消すとボーナス点！","Righe e colonne piene vengono eliminate; eliminarne più insieme dà punti bonus."],"h3":["Art arda temizleyerek kombo yap; 4 hamle temizlemezsen kombo sıfırlanır.","Clear lines back to back for combos; the combo resets after 4 moves without a clear.","Lösche Linien nacheinander für Kombos; nach 4 Zügen ohne Löschen endet die Kombo.","Enchaîne les effacements pour des combos ; le combo retombe après 4 coups sans effacer.","Encadena borrados para hacer combos; el combo se reinicia tras 4 jugadas sin borrar.","Limpe em sequência para fazer combos; o combo zera após 4 jogadas sem limpar.","Очищай линии подряд для комбо; после 4 ходов без очистки комбо сбрасывается.","連続でラインを消すとコンボ。4手消せないとリセットされます。","Elimina di seguito per fare combo; la combo si azzera dopo 4 mosse senza eliminare."],"h4":["Üzerinde sayı olan bloklar: sayı bitmeden temizlersen bonus puan kazanırsın.","Numbered blocks: clear them before the number runs out for bonus points.","Nummerierte Blöcke: Lösche sie, bevor die Zahl abläuft, für Bonuspunkte.","Blocs numérotés : efface-les avant la fin du compte pour gagner des points bonus.","Bloques con número: bórralos antes de que llegue a cero para ganar puntos extra.","Blocos numerados: limpe antes que o número acabe para ganhar pontos extras.","Блоки с числами: очисти их до конца отсчёта — получишь бонус.","数字付きブロックは、数字が尽きる前に消すとボーナス！","Blocchi numerati: eliminali prima che il numero finisca per ottenere punti bonus."],"h5":["Tahta tamamen boşalırsa bonus puan alırsın ve blokların tarzı değişir.","Clear the whole board for a bonus and a brand-new block style.","Räumst du das ganze Brett, gibt es einen Bonus und einen neuen Blockstil.","Vide tout le plateau pour un bonus et un nouveau style de blocs.","Si despejas todo el tablero ganas un bonus y cambia el estilo de los bloques.","Limpe o tabuleiro inteiro para ganhar bônus e um novo estilo de blocos.","Очисти всё поле — получишь бонус и новый стиль блоков.","盤面をすべて消すとボーナスとブロックの新スタイル！","Svuota tutta la griglia per un bonus e un nuovo stile dei blocchi."],"h6":["Hiçbir blok sığmazsa oyun biter. Sağ üstteki ⚙ ile oyunu duraklatırsın (PC: ESC).","If no block fits, the game ends. Tap ⚙ at the top right to pause (PC: Esc).","Passt kein Block mehr, ist das Spiel vorbei. Mit ⚙ oben rechts pausierst du (PC: Esc).","Si aucun bloc ne rentre, la partie est finie. ⚙ en haut à droite met en pause (PC : Échap).","Si no cabe ningún bloque, termina la partida. ⚙ arriba a la derecha pausa (PC: Esc).","Se nenhum bloco couber, o jogo acaba. ⚙ no canto superior direito pausa (PC: Esc).","Если ни один блок не помещается, игра заканчивается. ⚙ вверху справа — пауза (ПК: Esc).","置けるブロックがなくなると終了。右上の⚙で一時停止（PC: Esc）。","Se nessun blocco entra, la partita finisce. ⚙ in alto a destra mette in pausa (PC: Esc)."]};

 tr:{
  privacy:[["Son Güncelleme: 25 Kasım 2026","Bu metin, BLOCK SNAPPY’nin mevcut sürümünün işleyişi esas alınarak hazırlanmıştır. Oyuna reklam, analiz, çevrimiçi hesap, bulut kayıt veya uygulama içi satın alma gibi yeni özellikler eklenirse bu politika ilgili değişikliklere göre güncellenecektir."],["1. Veri Sorumlusu ve Politikanın Kapsamı","BLOCK SNAPPY, bağımsız bir blok bulmaca oyunu projesidir. Bu Gizlilik Politikası, BLOCK SNAPPY’yi tarayıcıda veya oyunun bu HTML sürümünü çalıştıran uyumlu bir ortamda kullandığınızda oyun tarafından hangi bilgilerin işlendiğini, bu bilgilerin nerede tutulduğunu ve hangi seçeneklere sahip olduğunuzu açıklar. İletişim ve gizlilik talepleri için bu politikanın 12. bölümündeki e-posta adresini kullanabilirsiniz."],["2. Hesap ve Kullanıcı Tarafından Verilen Bilgiler","Mevcut sürümde hesap oluşturma, üyelik, kullanıcı adı veya profil fotoğrafı yükleme zorunluluğu bulunmaz. Oyun, oyun içinde adınızı, ev adresinizi, telefon numaranızı, konumunuzu, rehberinizi, fotoğraflarınızı, kameranızı veya mikrofonunuzu istemez ve bu özelliklere erişmek için izin talep etmez. Bizimle e-posta yoluyla iletişim kurmayı seçerseniz, e-posta adresiniz ve mesajınız kullandığınız e-posta hizmeti aracılığıyla bize iletilir. Bu bilgileri yalnızca mesajınıza yanıt vermek ve talebinizi değerlendirmek için kullanırız."],["3. Oyun İçinde Cihazınızda Saklanan Bilgiler","Oyunun ilerlemenizi ve tercihlerinizi koruyabilmesi için bazı bilgiler kullandığınız cihazın tarayıcısındaki LocalStorage alanında saklanabilir. Bunlar; mevcut ve en yüksek skor, oynanan oyun sayısı, toplam puan, temizlenen çizgiler, yerleştirilen bloklar, kombo ve istatistik bilgileri, kazanılan başarımlar, günlük görev ilerlemesi, seçilen dil, tema ve blok görünümü ile ses, müzik ve titreşim gibi oyun tercihleri olabilir. Bu kayıtlar oyunun temel işlevlerini sağlamak içindir. Mevcut sürümde bu oyun kayıtlarını BLOCK SNAPPY sunucusuna gönderen bir hesap veya bulut senkronizasyon sistemi bulunmamaktadır."],["4. Otomatik Olarak Toplanan Cihaz ve Kullanım Verileri","Mevcut oyun kodu; cihaz modeli, reklam kimliği (Google Advertising ID veya IDFA), kesin konum, rehber, kamera veya mikrofon verisi toplamak üzere tasarlanmamıştır. Ayrıca oyuna entegre edilmiş bir davranışsal reklam, kullanıcı profilleme veya oyun içi analiz SDK’sı bulunmamaktadır. Bununla birlikte oyunu açtığınız web sitesi, barındırma sağlayıcısı, tarayıcı, işletim sistemi veya uygulama mağazası; güvenlik, bağlantı ve hizmet sunumu amacıyla IP adresi, erişim zamanı, tarayıcı türü ve teknik günlükler gibi verileri kendi sistemlerinde işleyebilir. Bu tür işlemler ilgili sağlayıcının kendi gizlilik politikası ve şartlarına tabidir; BLOCK SNAPPY’nin oyun kodu bu sunucu günlüklerini yönetmez."],["5. Bilgilerin Kullanım Amaçları","Cihazınızda saklanan oyun verileri; oyunu çalıştırmak, skor ve ilerlemenizi korumak, istatistikleri göstermek, başarımları ve günlük görevleri takip etmek, seçtiğiniz dil ve görünüm tercihlerini hatırlamak için kullanılır. Bize e-posta gönderirseniz, verdiğiniz iletişim bilgileri mesajınıza cevap vermek, teknik sorunları anlamak ve geri bildiriminizi değerlendirmek amacıyla kullanılabilir. Mevcut sürümde bu veriler reklam hedefleme veya üçüncü taraflara pazarlama amacıyla kullanılmaz."],["6. Üçüncü Taraf Hizmetler, Paylaşım ve E-posta","Mevcut sürümde Firebase, Unity Analytics, Google Analytics, Google AdMob, Unity Ads, Google Play Games veya Apple Game Center gibi analiz, reklam, çevrimiçi skor ya da bulut kayıt SDK’ları oyuna entegre edilmiş değildir. Paylaşım düğmesi, destekleyen cihaz ve tarayıcılarda sistem paylaşım penceresini açabilir. Paylaşım içeriğini, hedef uygulamayı ve alıcıyı siz seçersiniz; oyun rehberinize erişmez ve sizin onayınız olmadan paylaşım yapmaz. E-posta düğmesi Gmail’de alıcı ve konu bilgisi doldurulmuş yeni bir ileti taslağı açar. Oyun e-postayı otomatik olarak göndermez; içeriği kontrol edip gönderme işlemini siz yaparsınız. Gmail, WhatsApp, Telegram, X veya diğer üçüncü taraf hizmetleri kullandığınızda, bu hizmetlerin kendi gizlilik politikaları geçerlidir."],["7. Çerezler ve Benzer Teknolojiler","Oyunun mevcut kodu reklam çerezi, davranışsal izleme veya reklam kimliği kullanacak şekilde yapılandırılmamıştır. Oyun ilerlemesi ve tercihleri için tarayıcı LocalStorage alanından yararlanılır. Oyunun barındırıldığı web sitesi veya üçüncü taraf hizmetler, kendi işleyişleri kapsamında çerez veya benzer teknik teknolojiler kullanabilir. Bu kullanımlar ilgili hizmet sağlayıcının kontrolündedir."],["8. Verilerin Saklanma Süresi ve Silinmesi","LocalStorage kayıtları, siz oyun içindeki “Verileri Sıfırla” seçeneğini kullanana, tarayıcı/site verilerini temizleyene veya tarayıcı depolama alanı başka bir nedenle silinene kadar cihazınızda kalabilir. Cihaz değiştirmek, farklı tarayıcı kullanmak veya tarayıcı verilerini temizlemek oyun ilerlemesinin kaybolmasına neden olabilir. Mevcut sürümde oyun kayıtlarının BLOCK SNAPPY tarafından işletilen bir sunucuda saklanması veya cihazlar arasında eşitlenmesi söz konusu değildir. Bize e-posta ile gönderdiğiniz mesajlar ise talebinizi yanıtlamak ve gerekli yazışma geçmişini tutmak için makul süre boyunca e-posta hesabımızda kalabilir."],["9. Veri Güvenliği","Oyun kayıtları cihazınızın tarayıcısında tutulduğundan, bu kayıtların güvenliği cihazınızın, işletim sisteminizin ve tarayıcınızın güvenliğine bağlıdır. Cihazınızı güncel tutmanızı, başkalarıyla paylaşılan cihazlarda kişisel verilerinizi korumanızı ve cihazınızın güvenlik ayarlarını kullanmanızı öneririz. İnternet üzerinden hiçbir aktarım veya elektronik saklama yöntemi mutlak güvenlik garantisi vermez. E-posta ile gönderdiğiniz bilgiler, kullandığınız e-posta sağlayıcısının sistemlerinden geçer."],["10. Çocukların Gizliliği","BLOCK SNAPPY genel kitleye yönelik bir bulmaca oyunudur ve mevcut sürümde oyunculardan doğrudan kişisel bilgi girmeleri istenmez. Oyun, özellikle 13 yaşın altındaki çocuklardan kişisel veri toplamayı amaçlamaz. Ebeveyn veya yasal vasiler, çocukların cihaz ve internet kullanımını gözetebilir. Çocuğunuzun bize e-posta yoluyla kişisel bilgi gönderdiğini düşünüyorsanız, lütfen aşağıdaki iletişim adresinden bize ulaşın."],["11. KVKK ve Diğer Yasal Haklar","Bulunduğunuz yerde geçerli veri koruma mevzuatının tanıdığı haklar kapsamında, kişisel verilerinizin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, yanlış veya eksik bilgilerin düzeltilmesini isteme, mevzuatta öngörülen koşullarda silinmesini veya yok edilmesini talep etme ve hukuka aykırı işleme nedeniyle doğan haklarınızı kullanma imkânınız olabilir. Türkiye’de 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) kapsamındaki taleplerinizi e-posta yoluyla iletebilirsiniz. Oyunun mevcut sürümünde oyun ilerlemesi cihazınızda yerel olarak tutulduğundan, bu kayıtları silmek için oyun içindeki “Verileri Sıfırla” seçeneğini de kullanabilirsiniz. Reklam kişiselleştirme ayarları, mevcut sürümde oyuna entegre edilmiş bir reklam sistemi bulunmadığından uygulanmamaktadır."],["12. Politika Değişiklikleri ve İletişim","Oyunun özellikleri, kullanılan hizmetler veya yasal gereklilikler değiştiğinde bu Gizlilik Politikası güncellenebilir. Güncel sürüm bu bölümde yayımlanır ve son güncelleme tarihi değiştirilir. Gizlilik, kişisel veriler veya silme talepleriyle ilgili sorularınız için BLOCK SNAPPY geliştiricisine şu adresten ulaşabilirsiniz: blocksnappy@gmail.com. Mevcut sürüm için ayrıca belirtilmiş bir şirket unvanı veya web sitesi bulunmamaktadır."]],
  terms:[
   ['1. Kabul ve Kapsam','BLOCK SNAPPY’yi kullanarak bu Kullanım Şartları’nı kabul etmiş olursunuz. Şartları kabul etmiyorsanız oyunu kullanmayı bırakabilirsiniz. Bu metin, oyunun mevcut sürümünün kullanımını kapsar.'],
   ['2. Oyunun Kullanımı','BLOCK SNAPPY kişisel ve eğlence amaçlı kullanım için sunulan bir blok bulmaca oyunudur. Oyunu hukuka uygun şekilde kullanmalı; oyunun normal çalışmasını bozacak, güvenliğini zayıflatacak veya diğer kullanıcıların deneyimini olumsuz etkileyecek girişimlerde bulunmamalısınız.'],
   ['3. Fikri Haklar','Oyuna ait ad, görsel tasarım, arayüz, metinler, karakterler ve yazılım bileşenleri, ilgili hak sahiplerine aittir veya izin verilen şekilde kullanılmaktadır. Yazılı izin olmadan oyunun önemli bölümlerini kopyalamak, yeniden yayımlamak, satmak veya kendi ürününüz gibi sunmak yasaktır.'],
   ['4. Kayıtlar ve Cihaz','Skorlar ve tercihler mevcut sürümde kullandığınız cihazın tarayıcı depolama alanında tutulabilir. Tarayıcı verilerinin silinmesi, cihazın değiştirilmesi veya depolama alanının temizlenmesi kayıtların kaybolmasına neden olabilir. Kayıtların her koşulda korunacağı veya cihazlar arasında aktarılacağı garanti edilmez.'],
   ['5. Güncellemeler ve Kullanılabilirlik','Oyunun özellikleri, tasarımı veya erişilebilirliği zaman içinde değiştirilebilir. Bakım, teknik sorunlar, tarayıcı uyumsuzluğu veya üçüncü taraf hizmetlerindeki kesintiler nedeniyle oyuna erişim geçici olarak etkilenebilir.'],
   ['6. Sorumluluk Sınırı','Oyun mevcut hâliyle ve eğlence amacıyla sunulur. Teknik aksaklıklar, uyumsuz cihazlar, veri kaybı veya üçüncü taraf hizmetlerinden kaynaklanan sorunlar için mevzuatın izin verdiği ölçüde garanti verilmez. Bu şartlar, yürürlükteki kanunlar uyarınca kaldırılamayan tüketici haklarını ortadan kaldırmaz.'],
   ['7. Üçüncü Taraf Uygulamaları','Paylaşım veya e-posta gibi özellikler cihazınızdaki üçüncü taraf uygulamalarını açabilir. Bu uygulamaların hizmet koşulları ve gizlilik politikaları kendi sağlayıcıları tarafından belirlenir.'],
   ['8. Şartların Güncellenmesi','Bu şartlar oyunun özellikleri veya yasal gereklilikler değiştiğinde güncellenebilir. Güncel metin oyunun bu bölümünde yayımlandığı tarihten itibaren geçerlidir.'],
   ['9. İletişim','Kullanım şartlarıyla ilgili sorularınız için blocksnappy@gmail.com adresine yazabilirsiniz.']
  ],
  about:[
   ['Blokların gücünü keşfet!','BLOCK SNAPPY, her hamlenin yeni bir fırsat yarattığı, kolay öğrenilen ama ustalaşması keyifli bir blok bulmaca oyunudur. Amacın, farklı şekillerdeki blokları 8×8 oyun alanına akıllıca yerleştirerek satır ve sütunları tamamlamak, puan toplamak ve kendi rekorunu geliştirmektir.'],
   ['Kendi oyun tarzını oluştur','Kombo zincirleri, günlük görevler, başarımlar, istatistikler, farklı blok görünümleri ve renkli temalar her oyuna ayrı bir heyecan katar. İster kısa bir mola ver ister rekorunu yenilemek için tekrar dene; BLOCK SNAPPY her seviyeden oyuncuya keyifli bir bulmaca deneyimi sunmayı hedefler.'],
   ['Her hamlede biraz daha iyi','BLOCK SNAPPY’nin arkasındaki amaç sade: temiz bir tasarım, akıcı bir oynanış ve her seferinde “bir tur daha” dedirten bir deneyim. Geri bildirimlerin ve önerilerin oyunun gelişmesine yardımcı olur. Bizimle blocksnappy@gmail.com üzerinden iletişime geçebilirsin.']
  ]
 },
 en:{
  privacy:[["Last Updated: 25 November 2026","This notice is based on the current version of BLOCK SNAPPY. If advertising, analytics, online accounts, cloud saves, or in-app purchases are added, this policy will be revised to reflect those changes."],["1. Who We Are and Scope","BLOCK SNAPPY is an independent block-puzzle game project. This Privacy Policy explains how information is handled when you use BLOCK SNAPPY in a browser or compatible environment running this HTML version. For privacy questions or requests, use the email address in section 12."],["2. Account and Information You Provide","The current version does not require an account, membership, username, or profile photo. The game does not ask for your name, home address, phone number, location, contacts, photos, camera, or microphone access. If you choose to contact us by email, your email address and message are sent to us through the email service you use. We use that correspondence to respond to your message and review your request."],["3. Information Stored on Your Device","To preserve progress and preferences, the game may store information in your browser’s LocalStorage. This may include your current and best score, games played, total points, cleared lines, placed blocks, combo and statistics data, achievements, daily quest progress, selected language, theme and block style, and sound, music, and vibration preferences. These records support the game’s core features. The current version does not include an account or cloud-sync system that sends these game records to a BLOCK SNAPPY server."],["4. Automatically Collected Device and Usage Data","The current game code is not designed to collect device model information, advertising identifiers (Google Advertising ID or IDFA), precise location, contacts, camera data, or microphone data. It also does not include an integrated behavioral advertising, profiling, or in-game analytics SDK. However, the website host, hosting provider, browser, operating system, or app store may independently process IP addresses, access times, browser types, and technical logs for security, connectivity, or service delivery. Such processing is governed by the relevant provider’s own privacy policy and terms; BLOCK SNAPPY’s game code does not control those server logs."],["5. How Information Is Used","Information stored on your device is used to run the game, preserve scores and progress, display statistics, track achievements and daily quests, and remember language and appearance preferences. If you email us, the contact details and message you provide may be used to reply, understand technical issues, and review feedback. The current version does not use these records for ad targeting or third-party marketing."],["6. Third-Party Services, Sharing and Email","The current version does not integrate analytics, advertising, online-score, or cloud-save SDKs such as Firebase, Unity Analytics, Google Analytics, Google AdMob, Unity Ads, Google Play Games, or Apple Game Center. The Share button may open your device’s or browser’s share sheet where supported. You choose the content, destination app, and recipient; the game does not access your contacts or share anything without your action. The email button opens a new Gmail draft with the recipient and subject filled in. The game does not send the email automatically; you review and send it yourself. When you use Gmail, WhatsApp, Telegram, X, or another third-party service, that service’s own privacy policy applies."],["7. Cookies and Similar Technologies","The current game code is not configured to use advertising cookies, behavioral tracking, or advertising identifiers. It uses browser LocalStorage for game progress and preferences. The website hosting the game or third-party services may use cookies or similar technical technologies for their own operation. Those uses are controlled by the relevant provider."],["8. Retention and Deletion","LocalStorage records may remain on your device until you use the in-game Reset Data option, clear the browser or site data, or the browser storage is otherwise removed. Changing devices, using a different browser, or clearing browser data may result in lost progress. The current version does not store or synchronize game records on a BLOCK SNAPPY-operated server. Emails you send to us may remain in our email account for a reasonable period to respond to your request and maintain necessary correspondence."],["9. Data Security","Because game records are stored in your browser, their security depends on your device, operating system, and browser security. We recommend keeping your device updated and protecting your information on shared devices. No internet transmission or electronic storage method can be guaranteed to be completely secure. Information sent by email passes through the systems of your email provider."],["10. Children’s Privacy","BLOCK SNAPPY is a general-audience puzzle game and the current version does not ask players to enter personal information directly. The game is not designed to collect personal information from children under 13. Parents and guardians may supervise children’s use of devices and the internet. If you believe a child has sent us personal information by email, please contact us using the address below."],["11. Your Rights under Applicable Data Protection Laws","Depending on the laws that apply where you live, you may have rights to ask whether your personal data is processed, request access, correct inaccurate information, request deletion where legally available, and exercise other rights provided by law. Users in Türkiye may submit requests under Personal Data Protection Law No. 6698 (KVKK) by email. Since game progress in the current version is stored locally on your device, you can also delete those records using the in-game Reset Data option. Ad-personalization controls do not apply to the current version because no advertising system is integrated."],["12. Changes and Contact","This Privacy Policy may be updated if game features, service providers, or legal requirements change. The current version will be published in this section with a revised update date. For questions about privacy, personal information, or deletion requests, contact the BLOCK SNAPPY developer at blocksnappy@gmail.com. No separate company name or website is currently specified for this version."]],
  terms:[['1. Acceptance','By using BLOCK SNAPPY, you agree to these Terms. If you do not agree, stop using the game. These Terms cover the current version.'],['2. Permitted Use','BLOCK SNAPPY is a block puzzle game provided for personal entertainment. Use it lawfully and do not attempt to disrupt its normal operation, compromise its security or negatively affect other users.'],['3. Intellectual Property','The game name, visual design, interface, text, characters and software components belong to their respective rights holders or are used with permission. You may not copy, republish, sell or present substantial parts of the game as your own without written permission.'],['4. Saved Data','Scores and preferences may be stored in your browser on the device you use. Clearing browser data, changing devices or removing storage may result in lost progress. Continuous storage or cross-device transfer is not guaranteed.'],['5. Availability and Updates','Features, design and availability may change. Maintenance, technical issues, browser incompatibility or third-party outages may temporarily affect access.'],['6. Disclaimer','The game is provided as-is for entertainment. To the extent permitted by law, no guarantee is made against technical issues, incompatibility or data loss. Nothing here limits consumer rights that cannot legally be excluded.'],['7. Third-Party Apps','Sharing and email features may open third-party apps. Their terms and privacy practices are controlled by their providers.'],['8. Changes','These Terms may be updated as the game or legal requirements change. The latest version will appear in this section.'],['9. Contact','For questions about these Terms, email blocksnappy@gmail.com.']],
  about:[['A puzzle made for one more round','BLOCK SNAPPY is an easy-to-learn block puzzle where every move can create a new opportunity. Place different shapes on the 8×8 board, complete rows and columns, earn points and challenge your personal best.'],['Play your way','Combo chains, daily quests, achievements, statistics, block styles and colorful themes add variety to every session. Whether you have a minute to spare or want to beat your record, BLOCK SNAPPY aims to make every round satisfying.'],['Better with your feedback','Our goal is simple: a clear design, responsive gameplay and a puzzle experience that makes you want one more round. Your feedback helps the game grow. Contact us at blocksnappy@gmail.com.']]
 }

function legal(k){const lang=LI===0?'tr':'en',sections=LEGAL_TEXT[lang][k]||[];const body=sections.map(a=>'<h3>'+a[0]+'</h3><p>'+a[1]+'</p>').join('');modal('<div class="sth"><b>'+t(k)+'</b>'+X('more()')+'</div><div class="stp legal-copy">'+body+'</div>','ms')}
function contact(){const gmail='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(CONTACT_EMAIL)+'&su='+encodeURIComponent('BLOCK SNAPPY - İletişim')+'&body='+encodeURIComponent('Merhaba BLOCK SNAPPY ekibi,\n\nSize aşağıdaki konu hakkında ulaşmak istiyorum:\n\n\nTeşekkürler.');modal('<div class="sth"><b>'+t('contact')+'</b>'+X('more()')+'</div><div class="stp"><p class="lt">'+t('contactNote')+'<br><b>'+CONTACT_EMAIL+'</b></p><a class="mg" style="text-decoration:none;color:#fff" href="'+gmail+'" target="_blank" rel="noopener noreferrer">'+t('sendMail')+'</a><p class="lt" style="font-size:12px;opacity:.8;text-align:center">Gmail açılır ve alıcı bilgisi hazır gelir. Göndermeden önce mesajını yazıp kontrol edebilirsin.</p></div>','ms')}
function moreGames(){modal('<div class="sth"><b>'+t('moreGames')+'</b>'+X('more()')+'</div><div class="stp" style="text-align:center"><div class="gm">'+ghost('wow')+'</div><p class="lt" style="text-align:center">'+t('comingSoon')+'</p></div>','ms')}
function shareGame(){
 const u=/^https?:\/\//i.test(location.href)?location.href.split('#')[0]:'';
 const tx=t('shareText');
 const payload={title:'BLOCK SNAPPY',text:tx,...(u?{url:u}:{})};
 if(navigator.share){
   navigator.share(payload).catch(err=>{if(err&&err.name!=='AbortError')shareFallback(tx,u)});
 }else{
   shareFallback(tx,u);
 }
}
function shareFallback(tx,u){const msg=tx+(u?' '+u:'');const enc=encodeURIComponent(msg);modal('<div class="sth"><b>'+t('share')+'</b>'+X('more()')+'</div><div class="stp"><p class="lt">Paylaşmak istediğin uygulamayı seç.</p><div class="share-actions"><button onclick="shareTo(\'whatsapp\')">WhatsApp</button><button onclick="shareTo(\'telegram\')">Telegram</button><button onclick="shareTo(\'x\')">X</button><button onclick="copyShare()">Bağlantıyı Kopyala</button></div></div>','ms');window._snappyShare={msg,url:u}}
function shareTo(where){const d=window._snappyShare||{msg:t('shareText'),url:''},text=encodeURIComponent(d.msg),url=encodeURIComponent(d.url);const links={whatsapp:'https://wa.me/?text='+text,telegram:'https://t.me/share/url?url='+url+'&text='+text,x:'https://twitter.com/intent/tweet?text='+text+(d.url?'&url='+url:'')};if(links[where])window.open(links[where],'_blank','noopener,noreferrer')}
function copyShare(){const d=window._snappyShare||{msg:t('shareText'),url:''},value=d.msg+(d.url?' '+d.url:'');const done=()=>toast(t('linkCopied'));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(done).catch(()=>prompt('Paylaşım metnini kopyala',value));else prompt('Paylaşım metnini kopyala',value)}
function quests(){dayCheck();
 const rem=()=>{const q=Math.max(0,D.q.t+864e5-Date.now())/1000|0;return[q/3600|0,q%3600/60|0,q%60].map(x=>String(x).padStart(2,'0')).join(':')};
 modal('<h2>'+t('dailyQ')+'</h2>'+D.q.g.map(q=>{const v=Math.min(D.q.p[q.k]||0,q.n);return '<div class="li"><div style="flex:1">'+t(QDEF[q.k].t,q.n)+(v>=q.n?' <span data-i="check" style="color:#5fe36b;font-size:18px"></span>':'')+'<div class="bar"><i style="width:'+v/q.n*100+'%"></i></div></div><span>'+v+'/'+q.n+'</span></div>'}).join('')+
 '<p id="qt" style="text-align:center;opacity:.85;font-size:14px;margin:10px 0 0">'+t('newIn',rem())+'</p><button class="btn" onclick="closeM()">'+t('close')+'</button>');
 qiv=setInterval(()=>{const e=$('#qt');if(!e){clearInterval(qiv);return}if(Date.now()-D.q.t>=864e5){quests();return}e.textContent=t('newIn',rem())},1000)}
function achs(){modal('<h2>'+t('ach')+'</h2>'+ACH.map(a=>'<div class="li"><div>'+a.n()+'<small>'+a.d()+'</small></div><span>'+(D.ach[a.id]?'<span data-i="trophy" style="font-size:26px"></span>':'<span data-i="lock" style="font-size:22px;opacity:.65"></span>')+'</span></div>').join('')+'<button class="btn" onclick="closeM()">'+t('close')+'</button>')}
function stats(){const s=D.st,r=(a,b)=>'<div class="li">'+a+'<span>'+b+'</span></div>';modal('<h2>'+t('stats')+'</h2>'+r(t('bestScore'),D.best)+r(t('gamesPl'),s.games)+r(t('totalPts'),s.total)+r(t('linesL'),s.lines)+r(t('placedB'),s.placed)+r(t('maxCombo'),s.combo)+'<button class="btn" onclick="closeM()">'+t('close')+'</button>')}

/* ---------- olaylar ---------- */
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#game').classList.contains('on')){if(M.classList.contains('on')){if(paused)closeM()}else settings()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused&&!M.classList.contains('on'))settings()});
M.addEventListener('pointerdown',e=>{if(e.target===M&&playing)closeM()});
let rz=0;const resizeFit=()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(fit)};
addEventListener('resize',resizeFit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resizeFit);
document.addEventListener('contextmenu',e=>e.preventDefault());
applyTheme();fit();buildMenu();fillIcons(document);$('#menuGhost').innerHTML=ghost('happy');$('#sh').innerHTML=IC.heart;$('#heart').innerHTML=IC.heart;applyLang();show('menu');
</script>
